[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "firewall-policy-orchestrator"
version = "0.1.0"
description = "DORA-compliant Multi-Platform Firewall Policy Compiler & Validator"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
fw-tool = "fw_orchestrator.cli:main"